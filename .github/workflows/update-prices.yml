name: Actualizar precios

on:
  schedule:
    # Lunes–viernes a las 22:30 UTC (después del cierre de EU y US)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: # ejecución manual desde GitHub Actions

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Obtener precios de FMP
        run: node scripts/fetch-prices.js
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "Sin cambios en prices.json"
          else
            git commit -m "chore: precios $(date -u +%Y-%m-%d)"
            git push
          fi
