<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STOCKLE — El juego diario de bolsa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg-texture">
    <svg id="bg-line" viewBox="0 0 1200 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#00ff88" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path d="M0,300 L80,280 L150,300 L210,250 L280,265 L340,210 L410,235 L470,180 L540,205 L610,150 L680,185 L740,120 L810,150 L880,95 L950,130 L1020,70 L1090,110 L1160,55 L1200,80"
        fill="none" stroke="#00ff88" stroke-opacity="0.30" stroke-width="2" vector-effect="non-scaling-stroke" />
      <path d="M0,300 L80,280 L150,300 L210,250 L280,265 L340,210 L410,235 L470,180 L540,205 L610,150 L680,185 L740,120 L810,150 L880,95 L950,130 L1020,70 L1090,110 L1160,55 L1200,80 L1200,400 L0,400 Z"
        fill="url(#lg)" />
    </svg>
  </div>

  <div id="root">
    <!-- Header -->
    <header>
      <div class="logo-wrap">
        <span class="logo-dot"></span>
        <h1 class="mono logo">STOCK<span class="logo-accent">LE</span></h1>
      </div>
      <div class="header-right">
        <div id="streak-badge" title="Daily streak"></div>
        <button id="btn-how" class="icon-btn" aria-label="How to play">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M9.3 9a2.7 2.7 0 0 1 5.2 1c0 1.8-2.7 2-2.7 4"/><path d="M12 17.5h.01"/>
          </svg>
        </button>
        <button id="btn-share" class="icon-btn" aria-label="Share">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Search -->
    <div id="search-section">
      <div id="search-wrap">
        <div id="search-box">
          <span class="search-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
            </svg>
          </span>
          <input id="search-input" placeholder="Guess a stock — name or ticker…" autocomplete="off" spellcheck="false" />
          <kbd class="mono search-kbd" id="search-kbd">↵</kbd>
        </div>
        <div id="autocomplete" class="hidden"></div>
      </div>
      <div class="guess-meta">
        <span class="guess-meta-left">Guess <strong id="guess-num">1</strong> of 6</span>
        <span class="guess-meta-right" id="puzzle-label"></span>
      </div>
    </div>

    <!-- Grid -->
    <div id="grid-section"></div>

    <!-- Footer -->
    <div id="footer"></div>
  </div>

  <script src="stocks.js"></script>
  <script src="app.js"></script>
</body>
</html>
